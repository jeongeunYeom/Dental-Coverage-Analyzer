name: Build Windows MVP

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[build]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build onedir application
        run: python -m PyInstaller --noconfirm --clean DentalCoverageAnalyzer.spec
      - name: Create distribution ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\DentalCoverageAnalyzer\* -DestinationPath DentalCoverageAnalyzer-Windows.zip -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentalCoverageAnalyzer-Windows
          path: DentalCoverageAnalyzer-Windows.zip
          if-no-files-found: error
